# AskRepo — development stack.
#
#   cd infra && docker compose up --build
#
# Every environment value has a `${VAR:-default}` fallback, so this comes up with
# no .env file at all. To override, create `infra/.env` or export the vars.
#
# Frontend  http://localhost:3000
# API       http://localhost:8000   (docs at /docs)
# Qdrant    http://localhost:6333/dashboard
# Postgres  localhost:5432          (projects, users, refresh tokens)
# Redis     localhost:6379          (rate limiting)
# Kafka     localhost:9092          (ingestion job queue, M1)

name: askrepo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askrepo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askrepo}
      POSTGRES_DB: ${POSTGRES_DB:-askrepo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askrepo} -d ${POSTGRES_DB:-askrepo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; use Qdrant's own binary as the probe.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # appendonly is kept even though the job queue moved to Kafka at M1: the
    # rate-limit counters don't need durability, but losing them on every restart
    # would reset every lockout.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      # Single-node KRaft: this one container is both the broker and the controller,
      # so the quorum voter list points at itself and there is no ZooKeeper.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-TxqebIstTHqeFT1rjwosQQ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      # Two client listeners because the same broker is reached under two names: the
      # host-published one (local `make dev`) must advertise localhost, and the
      # in-network one (the backend container) must advertise `kafka`. Advertising a
      # single address would break whichever side it isn't.
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # These three default to 3. A one-broker cluster cannot satisfy that, and the
      # broker never finishes starting — it is not a warning, it is a hang.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created explicitly at startup (app/queue/producer.py) so they get
      # the 2 partitions the concurrency cap depends on; an auto-created topic would
      # get 1 and silently halve it.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-AskRepo API}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-askrepo}:${POSTGRES_PASSWORD:-askrepo}@postgres:5432/${POSTGRES_DB:-askrepo}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # The in-network listener, not the host-published one: `localhost:9092` inside
      # this container is this container.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      # No fallback: a committed placeholder here would be a valid, publicly-known
      # password every reader of this file already has. Set it in the environment or
      # in infra/.env before the first `make up` / `make seed`.
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      # Nothing sits in front of the API in the dev stack, so trust the socket address.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    volumes:
      # Source bind-mount for hot reload. The venv lives in /opt/venv, so it survives.
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Resolved in the browser, so it points at the host-published API port.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      # Anonymous volumes keep the image's node_modules/.next from being
      # shadowed by the bind-mount above.
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  qdrant_data:
  redis_data:
  kafka_data:

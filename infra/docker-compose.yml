# AskRepo — development stack.
#
#   cd infra && docker compose up --build
#
# Every environment value has a `${VAR:-default}` fallback, so this comes up with
# no .env file at all. To override, create `infra/.env` or export the vars.
#
# Frontend  http://localhost:3000
# API       http://localhost:8000   (docs at /docs)
# Qdrant    http://localhost:6333/dashboard
# Postgres  localhost:5432          (projects, users, refresh tokens)
# Redis     localhost:6379          (rate limiting)
# Kafka     localhost:9092          (ingestion job queue, M1)
#
# Ollama is NOT in this stack by default. It runs on the host — `ollama serve` —
# and the app containers reach it at host.docker.internal:11434. See the `ollama`
# service near the bottom for why, and for how to opt back into the container.
#
# `worker` runs the ingestion consumers (2 replicas, one per ingest partition) and
# publishes no port — it is reached through Kafka, not over HTTP.

name: askrepo

# Shared by `backend` and `worker`. They run the same image from the same build and
# must agree on every datastore and secret — the worker writes the vectors the API
# deletes, and reads the PATs the API encrypted. Two hand-maintained copies of this
# block would drift, and the first symptom would be a worker that cannot decrypt.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-askrepo}:${POSTGRES_PASSWORD:-askrepo}@postgres:5432/${POSTGRES_DB:-askrepo}
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://redis:6379/0
  # The in-network listener, not the host-published one: `localhost:9092` inside
  # this container is this container.
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
  # Encrypts stored PATs at rest. The API writes them and the worker reads them, so
  # a mismatch here is a clone that fails with a decryption error, not a warning.
  PAT_ENCRYPTION_KEY: ${PAT_ENCRYPTION_KEY:-dev-insecure-change-me}
  # Shared, not worker-only: the worker embeds documents at index time and the API
  # embeds the question at query time. They must agree, because the collection name
  # is derived from provider + model + width — disagree and the API searches a
  # collection the worker never wrote to.
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  # Points at the model server on the HOST, not at a service in this file.
  # `localhost:11434` inside a container is that container, and `host.docker.internal`
  # is the address Docker gives it for the machine outside — resolved by Docker
  # Desktop natively, and on Linux by the `extra_hosts` entry on each app service.
  # If you opt into the containerised `ollama` service below, override this and
  # CHAT_BASE_URL to `http://ollama:11434` in infra/.env.
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askrepo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askrepo}
      POSTGRES_DB: ${POSTGRES_DB:-askrepo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askrepo} -d ${POSTGRES_DB:-askrepo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; use Qdrant's own binary as the probe.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # appendonly is kept even though the job queue moved to Kafka at M1: the
    # rate-limit counters don't need durability, but losing them on every restart
    # would reset every lockout.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      # Single-node KRaft: this one container is both the broker and the controller,
      # so the quorum voter list points at itself and there is no ZooKeeper.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-TxqebIstTHqeFT1rjwosQQ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      # Two client listeners because the same broker is reached under two names: the
      # host-published one (local `make dev`) must advertise localhost, and the
      # in-network one (the backend container) must advertise `kafka`. Advertising a
      # single address would break whichever side it isn't.
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # These three default to 3. A one-broker cluster cannot satisfy that, and the
      # broker never finishes starting — it is not a warning, it is a hang.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created explicitly at startup (app/queue/producer.py) so they get
      # the 2 partitions the concurrency cap depends on; an auto-created topic would
      # get 1 and silently halve it.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      <<: *app-env
      APP_NAME: ${APP_NAME:-AskRepo API}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
      # No fallback: a committed placeholder here would be a valid, publicly-known
      # password every reader of this file already has. Set it in the environment or
      # in infra/.env before the first `make up` / `make seed`.
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      # Nothing sits in front of the API in the dev stack, so trust the socket address.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # API-only: the worker indexes, it never answers a question. Same reasoning as
      # EMBEDDING_BASE_URL for the host — `localhost` here is this container.
      CHAT_PROVIDER: ${CHAT_PROVIDER:-ollama}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5-coder:14b}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-http://host.docker.internal:11434}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
    # Docker Desktop resolves host.docker.internal on its own; the Linux daemon does
    # not, and `host-gateway` is what gives it the same name there. Both app services
    # need it because both talk to the model server on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Source bind-mount for hot reload. The venv lives in /opt/venv, so it survives.
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    # The same image as the API, run with a different entrypoint, so the worker
    # shares Settings, the ORM models, the repositories and the access resolver
    # rather than growing a parallel copy of any of them.
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    command: ["uv", "run", "python", "-m", "app.worker"]
    restart: unless-stopped
    # Two replicas against the two ingest partitions. That is what makes the
    # concurrency cap of 2 in docs/PRD.md §4.1 structural rather than a setting:
    # a third worker would sit idle with no partition to own.
    deploy:
      replicas: 2
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app
      # Scratch, deliberately not a named volume: the working copy is deleted after
      # indexing and a reindex re-clones, so nothing here needs to survive a restart.
      - repo_scratch:/data/repos
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    # OFF by default, and that is a performance decision rather than a preference.
    # A container gets no GPU on macOS and only the Docker VM's memory allowance, so
    # a model here runs on CPU inside a slice of RAM — a reduce call against a 7B
    # model on CPU took 22 minutes (docs/PRD.md §6, M4.5). Run by the host instead,
    # `ollama serve` gets Metal and the whole machine. So the default is:
    #
    #   ollama serve          # on the host
    #   make infra            # four datastores, no model server
    #   make dev              # apps on the host, talking to localhost:11434
    #
    # ...and `make up` points the app containers at host.docker.internal:11434.
    #
    # This service stays for the box where the container IS the right answer — a
    # Linux host with the NVIDIA runtime, or a machine where you want the models in
    # a volume. Two steps to opt in, and the second is not optional:
    #
    #   1. make infra OLLAMA_IN_DOCKER=1   (or `docker compose --profile ollama up`)
    #   2. set EMBEDDING_BASE_URL and CHAT_BASE_URL to http://ollama:11434 in
    #      infra/.env — they default to the host, so without this the containers
    #      talk past the service you just started.
    #
    # No model is pre-pulled either way. On the host that is `make pull-models`;
    # here it is:
    #   docker compose exec ollama ollama pull qwen2.5-coder:14b
    #   docker compose exec ollama ollama pull nomic-embed-text
    profiles: ["ollama"]

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Resolved on the SERVER — the frontend proxies the API, so the browser never
      # calls it directly. That is why this is the service name and not the published
      # host port: it is Next talking to the backend over the compose network.
      API_URL: ${API_URL:-http://backend:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      # Anonymous volumes keep the image's node_modules/.next from being
      # shadowed by the bind-mount above.
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  qdrant_data:
  redis_data:
  kafka_data:
  ollama_models:
  repo_scratch:
